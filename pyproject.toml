[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "producthunt-connector"
version = "0.1.0"
description = "Product Hunt GraphQL connector for Zoth OS. Read listing, diff website/GitHub, never auto-post."
authors = [{ name = "1nc0gn30", email = "hello@nullai.tech" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://zoth.nullai.tech/tools/producthunt-connector"
Repository = "https://github.com/1nc0gn30/producthunt-connector"
Documentation = "https://nullai.tech"

[project.scripts]
producthunt-connector = "producthunt_connector.cli:main"
zoth-ph = "producthunt_connector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
